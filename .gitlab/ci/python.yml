.python:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  extends:
    - .actions-rules:python
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
    UV_PYTHON: "3.10"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  before_script:
    - uv sync --frozen --all-extras --all-packages
  after_script:
    - uv cache prune --ci

python:lint:
  extends: .python
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
    policy: pull
  script:
    - uv run ruff check .
    - uv run ruff format --check .

python:types:
  extends: .python
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
    policy: pull
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libatomic1
    - uv sync --frozen --all-extras --all-packages
  script:
    - uv run pyright

python:test:
  extends: .python
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - uv sync --frozen --all-extras --all-packages
    - uv build --out-dir "$CI_PROJECT_DIR/.uv-warmup"
  script:
    - uv run pytest --cov --cov-report=term --cov-report=xml -q
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

python:arm64:
  extends: .python
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
    policy: pull
  before_script: []
  after_script: []
  script:
    - uv export --frozen --all-extras --no-dev --no-emit-project --no-hashes -o /tmp/edge.txt
    - >
      uv pip compile --only-binary :all:
      --python-platform aarch64-unknown-linux-gnu --python-version 3.10
      /tmp/edge.txt -o /tmp/arm64.txt

api:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  extends:
    - .actions-rules:python
  needs:
    - python:test
  script:
    - docker build --build-arg EXTRA=api -t "$CI_PROJECT_NAME-api:$CI_COMMIT_SHORT_SHA" .
    - >
      docker run -d --name api -p 8080:8080
      -e XVISION_AUTH_SECRET=segredo-de-ci-com-tamanho-suficiente-para-passar
      --entrypoint uv "$CI_PROJECT_NAME-api:$CI_COMMIT_SHORT_SHA"
      run --no-sync uvicorn api:create_app --factory --host 0.0.0.0 --port 8080
    - sleep 5
    - docker run --rm --network host curlimages/curl:8.11.1 -sf http://localhost:8080/health
    - docker run --rm --network host curlimages/curl:8.11.1 -sf http://localhost:8080/openapi.json -o /tmp/o.json
    # Sem `-f` de proposito: com ele o curl sai com erro no 401 e o status nunca chega ao grep.
    - docker run --rm --network host curlimages/curl:8.11.1 -s -o /dev/null -w "%{http_code}" http://localhost:8080/v1/videos/1/render | grep -q 401
