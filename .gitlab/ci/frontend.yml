.frontend:
  stage: test
  image: node:22-alpine
  extends:
    - .actions-rules:frontend
  variables:
    VITE_API_URL: "http://localhost:8080"
  cache: &frontend-cache
    key:
      files:
        - src/interface/package-lock.json
    paths:
      - .npm/
    policy: pull
  before_script:
    - cd src/interface
    - npm ci --prefer-offline --no-audit --fund=false

frontend:lint:
  extends: .frontend
  script:
    - npm run lint

frontend:format:
  extends: .frontend
  script:
    - npm run format:check

frontend:types:
  extends: .frontend
  script:
    - npm run types:check

frontend:test:
  extends: .frontend
  script:
    - npm run test
  coverage: '/^Lines\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: src/interface/coverage/cobertura-coverage.xml

frontend:build:
  extends: .frontend
  cache:
    <<: *frontend-cache
    policy: pull-push
  script:
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - src/interface/dist/

frontend:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  extends:
    - .actions-rules:frontend
  needs:
    - frontend:lint
    - frontend:format
    - frontend:types
    - frontend:test
    - frontend:build
  script:
    - docker build -t "$CI_PROJECT_NAME-frontend:$CI_COMMIT_SHORT_SHA" src/interface
    - docker run -d --name fe -p 3000:3000 "$CI_PROJECT_NAME-frontend:$CI_COMMIT_SHORT_SHA"
    - sleep 3
    - docker run --rm --network host curlimages/curl:8.11.1 -sf http://localhost:3000/health
    - docker run --rm --network host curlimages/curl:8.11.1 -sf -o /dev/null http://localhost:3000/results/7
    - >
      docker run --rm --network host curlimages/curl:8.11.1 -sf -o /dev/null
      -w "%{content_type}" http://localhost:3000/favicon.svg | grep -q "image/svg"

product:e2e:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    COMPOSE_PROJECT_NAME: xvision
    XVISION_AUTH_SECRET: segredo-de-ci-com-tamanho-suficiente-para-passar
  needs:
    - job: frontend:lint
      optional: true
    - job: frontend:format
      optional: true
    - job: frontend:types
      optional: true
    - job: frontend:test
      optional: true
    # Opcional porque o diff pode tocar so o frontend, e ai `python:test` nem entra
    # no pipeline. Sem isso o GitLab recusa criar o pipeline inteiro.
    - job: python:test
      optional: true
  extends:
    - .actions-rules:e2e
  timeout: 20m
  script:
    - apk add --no-cache docker-cli-compose jq
    - mkdir -p var && printf 'legacy-state-preserved' > var/upgrade-marker
    - docker compose up -d --build --wait --wait-timeout 180
    - docker compose exec -T api grep -q legacy-state-preserved /var/xvision/upgrade-marker
    - docker build -f src/interface/Dockerfile.e2e -t xvision-e2e src/interface
    - >
      docker run --name xvision-e2e-before --network xvision_default
      xvision-e2e npm run test:e2e -- --grep-invert @after-restart
    - docker cp xvision-e2e-before:/work/e2e-state.json ./e2e-state.json
    - docker cp xvision-e2e-before:/fixtures/resultado.mp4 ./e2e-render.mp4
    - E2E_VIDEO_ID="$(jq -r .videoId e2e-state.json)"
    - docker compose exec -T api mkdir -p /var/xvision/api/renders
    - docker compose cp ./e2e-render.mp4 "api:/var/xvision/api/renders/$E2E_VIDEO_ID.mp4"
    - docker compose restart api
    - docker compose up -d --wait --wait-timeout 180
    - >
      docker run --name xvision-e2e-after --network xvision_default
      -v "$PWD/e2e-state.json:/work/e2e-state.json:ro"
      xvision-e2e npm run test:e2e -- --grep @after-restart
  after_script:
    - docker compose logs --no-color > compose.log 2>&1 || true
    - docker cp xvision-e2e-before:/work/playwright-report ./playwright-report-before 2>/dev/null || true
    - docker cp xvision-e2e-before:/work/test-results ./test-results-before 2>/dev/null || true
    - docker cp xvision-e2e-after:/work/playwright-report ./playwright-report-after 2>/dev/null || true
    - docker cp xvision-e2e-after:/work/test-results ./test-results-after 2>/dev/null || true
    - docker compose down --volumes --remove-orphans || true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - compose.log
      - playwright-report-before/
      - test-results-before/
      - playwright-report-after/
      - test-results-after/
