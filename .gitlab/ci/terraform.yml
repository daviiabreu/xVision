.terraform:
  stage: test
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  extends:
    - .actions-rules:python
  before_script:
    - cd infra
    - terraform init -backend=false -input=false

terraform:fmt:
  extends: .terraform
  before_script: []
  script:
    - terraform fmt -check -recursive infra/

terraform:validate:
  extends: .terraform
  script:
    - terraform validate

terraform:plan:
  extends: .terraform
  script:
    - terraform plan -input=false -lock=false
