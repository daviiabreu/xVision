services:
  edge:
    build:
      context: .
    volumes:
      - ./data/footstats:/data:ro
      - ./config:/app/config:ro
      - ./var:/var/xvision

  api:
    build:
      context: .
      args:
        EXTRA: api
    entrypoint:
      - uv
      - run
      - --no-sync
      - uvicorn
      - api:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "8080:8080"
    environment:
      XVISION_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      XVISION_AUTH_SECRET: ${XVISION_AUTH_SECRET:-segredo-de-desenvolvimento-trocar-antes-de-implantar}
      XVISION_API_TOKEN: ${XVISION_API_TOKEN:-}
    volumes:
      - ./config:/app/config:ro
      - ./var:/var/xvision
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
