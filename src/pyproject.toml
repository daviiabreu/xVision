[project]
name = "xvision"
version = "0.1.0"
description = "xVision: extrai features de finalizacao a partir de video, com processamento na borda"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Inteli T12 G02" }]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "tomli>=2.0; python_version < '3.11'",
    "typer>=0.15",
]

[project.scripts]
xvision = "cli:app"

[project.entry-points."xvision.modules"]
players-yolo = "edge.participants.module:PlayersModule"
tracking-yolo = "edge.participants.module:TrackingModule"

[project.optional-dependencies]
conformance = ["pytest>=8.3"]
players = ["ultralytics>=8.3,<9", "lap>=0.5.12"]
topview = [
    "ultralytics>=8.3,<9",
    "lap>=0.5.12",
    "torch>=2.2",
    "imageio-ffmpeg>=0.5",
]
ball = ["ultralytics>=8.3,<9", "lap>=0.5.12"]
training = [
    "SoccerNet>=0.1",
    "tqdm>=4.66",
    "ultralytics>=8.3,<9",
    "torch>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]
field = []
tracking = []
identity = []
pose = []
shot = []
mlops = []
api = ["fastapi>=0.115", "pydantic>=2.9", "uvicorn[standard]>=0.32"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "tomli>=2.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pyyaml>=6.0",
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "cli", "contracts", "edge", "mlops"]
exclude = ["api/docs/xvision", "api/docs/README.md"]

[tool.hatch.build.targets.sdist]
only-include = ["api", "cli", "contracts", "edge", "mlops", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["api", "cli", "contracts", "edge", "mlops"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["api", "cli", "contracts", "edge", "mlops"]

[tool.uv]
override-dependencies = ["opencv-python; sys_platform == 'never'"]
# O `ultralytics` depende de `opencv-python`, o build com GUI, enquanto o projeto declara
# `opencv-python-headless`. Com os dois instalados quem ganha o nome `cv2` depende da ordem de
# instalacao, e o build com GUI exige libxcb, libGL e o resto do X11.
#
# Isso quebrou o CI de forma nao obvia: os testes da API falhavam com
# `ImportError: libxcb.so.1: cannot open shared object file`, sem nenhuma relacao aparente com a
# mudanca que os trouxe. E o mesmo pacote iria parar na imagem do dispositivo de borda, que nao tem
# tela nenhuma.
#
# O marcador `sys_platform == 'never'` nunca e verdadeiro, entao a dependencia transitiva some e
# sobra so o headless, que oferece o mesmo `cv2` sem as funcoes de janela. O `ultralytics` nao usa
# janela fora de `show=True`.
#
# A anotacao do gabarito nao se perde com isso, e foi medido: o wheel headless de macOS reporta
# `GUI: COCOA` e `cv2.imshow` funciona, entao `xvision label scrub` continua abrindo janela ali. O
# wheel de Linux reporta `GUI: NONE`, e para esse caso existe `xvision label sheet`, que escreve
# PNG. O `scrub` le o backend do proprio build e aponta o caminho alternativo quando nao ha janela.

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "models"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
