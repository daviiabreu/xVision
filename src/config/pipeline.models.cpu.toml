# Os modelos reais de `pipeline.models.toml`, para maquina sem CUDA.
#
# Difere da configuracao de producao em duas diretivas e em mais nada: sai `quantize = "fp16"` de
# `players` e de `ball`, e sai `letterbox = "cuda"` de `ball`. As duas exigem GPU NVIDIA, e em CPU a
# primeira falha em `torch.cuda` e a segunda nao tem dispositivo onde rodar.
#
# Existe para uma coisa: a evidencia operacional com os modulos reais ser reproduzivel por quem
# nao tem a Jetson. A evidencia da Sprint 3 rodou com stubs porque o clone limpo nao carrega peso,
# e a revisao apontou que isso limita outra pessoa de repetir o experimento. Com esta
# configuracao versionada, o comando que produziu a evidencia roda em qualquer maquina com os
# pesos em `var/models`.
#
# Os numeros de tempo desta configuracao NAO sao os da Jetson: fp32 no CPU e outra coisa. Ela
# prova que os modulos reais atravessam o produto, e nao desempenho.
#
# `src/tests/test_config_cpu.py` cobra que ela continue igual a de producao fora dessas duas
# diretivas. Sem isso, mudar um limiar em `pipeline.models.toml` deixaria esta para tras, e a
# evidencia passaria a descrever uma configuracao que ninguem roda.
#
#   XVISION_PIPELINE=pipeline.models.cpu.toml xvision ...

[frames.coarse]
strategy = "uniform"
fps = 5

[frames.dense]
strategy = "uniform"
fps = 15

[frames.tdeed]
strategy = "uniform"
fps = 12.5
# O checkpoint do T-DEED foi treinado a 25 fps com passo 2. A 59,94 fps nativos o passo inteiro
# mais proximo e 5, o que da 11,99 por segundo, 4% abaixo do treino. O numero medido no pipeline
# sai com essa amostragem, e nao com a do experimento fora da arvore.

[frames.window]
strategy = "around"
anchor   = "shot"
before_s = 1.5
after_s  = 0.5
fps      = "native"

[modules.players]
impl     = "edge.modules.players:YoloPlayers"
artifact = "models/manifests/players/football-player-detection-1.0.0.toml"
frames   = "dense"

[modules.ball]
impl     = "edge.modules.ball:YoloBall"
artifact = "models/manifests/ball/yolo-football-ball-detection-0.1.0.toml"
frames   = "dense"
conf            = 0.10
imgsz           = 1600
ladrilhos       = 2
sobreposicao_px = 100
# Ranking so de aparencia, sem a estimativa de movimento da camera. Rejeitado em 07/09/2026 com o
# artefato da Sprint 3 e ligado pelo catalogo de 363 clipes na Jetson, contra o braco desligado.
# Decisao e resultados em sprint-4/modelos/bola-e-trajetoria, TB-09.
ranking            = true
ranking_candidates = 2
ranking_artifact   = "aparencia"

[modules.field]
impl     = "edge.modules.field:YoloField"
artifact = "models/manifests/field/pitch-keypoints-yolo11n-pose-0.1.0.toml"
frames   = "dense"
imgsz                         = 960
conf                          = 0.25
method                        = "ransac"
keypoint_confidence           = 0.25
threshold_diagonal_fraction   = 0.0025
min_inliers                   = 6
max_reprojection_p95_px       = 10.0

[modules.shot]
impl     = "edge.modules.shot:TdeedShot"
artifact = "models/manifests/shot/tdeed-soccernetball-test-1.0.0.toml"
frames   = "tdeed"
# O instante sai do T-DEED, que roda em processo separado por external/tdeed/run.py porque o codigo
# dele e GPL-3.0. A regra cinematica, `edge.modules.shot:BallBreakShot` com frames = "dense", segue
# disponivel e e a que o pipeline de stubs usa.

[modules.tracking]
impl   = "edge.modules.tracking:ByteTrackTracking"
frames   = "dense"
# ByteTrack com costura de fragmentos por distancia, papel e cor da camisa. O greedy,
# `edge.modules.tracking:GreedyTracking`, segue disponivel e e o de players-debug.

[modules.pose]
impl     = "edge.modules.pose:YoloPose"
artifact = "models/manifests/pose/yolov8n-pose-8.4.0.toml"
frames   = "dense"

[modules.identity]
impl   = "edge.modules.identity:TeamIdentity"
frames = "dense"

[modules.marking]
impl  = "edge.modules.stubs:StubMarking"
frames = "dense"
needs = ["players", "tracking", "identity"]

[features.body_part]
impl = "edge.features.body_part:BodyPart"

[features.type_of_play]
impl = "edge.features.type_of_play:TypeOfPlay"

[features.looked_before]
impl = "edge.features.looked_before:LookedBefore"

[features.looked_at_goal]
impl = "edge.features.looked_at_goal:LookedAtGoal"

[features.goalkeeper_position]
impl = "edge.features.goalkeeper_position:GoalkeeperPosition"

[render.top_view]
players = "models/manifests/players/football-player-detection-1.0.0.toml"
field = "models/manifests/field/pitch-keypoints-yolo11n-pose-0.1.0.toml"
