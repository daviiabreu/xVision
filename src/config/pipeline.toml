[render.top_view]
players = "models/manifests/players/football-player-detection-1.0.0.toml"
field = "models/manifests/field/pitch-keypoints-yolo11n-pose-0.1.0.toml"

[frames.coarse]
strategy = "uniform"
fps = 5

[frames.dense]
strategy = "uniform"
fps = 15

[frames.tdeed]
strategy = "uniform"
fps = 12.5
# O checkpoint do T-DEED foi treinado a 25 fps com passo 2. A 59,94 fps nativos o passo inteiro
# mais proximo e 5, o que da 11,99 por segundo, 4% abaixo do treino. O numero medido no pipeline
# sai com essa amostragem, e nao com a do experimento fora da arvore.

[frames.window]
strategy = "around"
anchor   = "shot"
before_s = 1.5
after_s  = 0.5
fps      = "native"

[modules.players]
impl   = "edge.modules.stubs:StubPlayers"
frames   = "dense"

[modules.ball]
impl   = "edge.modules.stubs:StubBall"
frames = "dense"

[modules.field]
impl   = "edge.modules.stubs:StubField"
frames   = "dense"

[modules.shot]
impl   = "edge.modules.shot:BallBreakShot"
frames = "dense"

[modules.tracking]
impl   = "edge.modules.stubs:StubTracking"
frames   = "dense"

[modules.pose]
impl   = "edge.modules.stubs:StubPose"
frames   = "dense"

[modules.identity]
impl   = "edge.modules.stubs:StubIdentity"
frames   = "dense"

[modules.marking]
impl   = "edge.modules.stubs:StubMarking"
frames = "dense"
needs  = ["players", "tracking", "identity"]

[features.body_part]
impl = "edge.features.body_part:BodyPart"

[features.goalkeeper_position]
impl = "edge.features.goalkeeper_position:GoalkeeperPosition"

[features.looked_before]
impl = "edge.features.looked_before:LookedBefore"

[features.looked_at_goal]
impl = "edge.features.looked_at_goal:LookedAtGoal"

[features.type_of_play]
impl = "edge.features.type_of_play:TypeOfPlay"

[features.marked]
impl = "edge.features.marked:Marked"

[features.assist]
impl = "edge.features.assist:Assist"

[features.crowded]
impl = "edge.features.crowded:Crowded"
