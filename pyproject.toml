[project]
name = "xvision"
version = "0.1.0"
description = "xVision: extrai features de finalizacao a partir de video, com processamento na borda"
readme = "src/README.md"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Inteli T12 G02" }]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "tomli>=2.0; python_version < '3.11'",
    "typer>=0.15",
]

[project.scripts]
xvision = "cli:app"

[project.optional-dependencies]
conformance = ["pytest>=8.3"]
players = ["ultralytics>=8.3,<9", "lap>=0.5.12"]
ball = []
field = []
tracking = []
identity = []
pose = []
shot = []
mlops = []
api = ["fastapi>=0.115", "pydantic>=2.9", "uvicorn[standard]>=0.32"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "tomli>=2.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pyyaml>=6.0",
    "httpx2>=2.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
# O `ultralytics` exige `opencv-python`, que e a build com GUI e linka libxcb e libGL. A
# borda e a imagem do CI sao slim e nao tem nenhuma das duas, entao o `import cv2` morria em
# `libxcb.so.1: cannot open shared object file`. As duas distribuicoes instalam o mesmo modulo
# `cv2`, entao ter as duas na env nunca foi opcao: uma sobrescreve a outra. O marcador abaixo
# nunca e verdadeiro, e e assim que se tira um requisito da resolucao sem tocar no `ultralytics`.
override-dependencies = ["opencv-python; sys_platform == 'nunca'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/cli", "src/contracts", "src/edge", "src/mlops"]
exclude = ["src/api/docs/xvision", "src/api/docs/README.md"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "pyproject.toml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["src/tests", "packages/xvision-players-yolo/tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = [
    "src/api",
    "src/cli",
    "src/contracts",
    "src/edge",
    "src/mlops",
    "src/models",
    "packages/xvision-players-yolo/src/xvision_players_yolo",
]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["api", "cli", "contracts", "edge", "mlops", "xvision_players_yolo"]

[tool.pyright]
include = ["src", "packages"]
# `src/models` e script de operador em cima de `roboflow`, `ultralytics` e `torch`, que nao
# publicam tipo. Em `strict` isso vira ruido puro: eram 233 erros na develop e 102 aqui, todos
# `reportUnknown*` de biblioteca de terceiro. Nada disso entra na wheel (ver
# `[tool.hatch.build.targets.wheel] packages`), e o gate vermelho permanente fazia o time parar
# de ler a saida inteira. A cobertura continua medindo esses arquivos.
# Os tres primeiros sao o padrao do pyright, repetidos porque declarar `exclude` substitui a
# lista dele em vez de somar: sem eles um `.venv` dentro de `packages/` entra na verificacao.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "src/models"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
