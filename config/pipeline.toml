[render.top_view]
players = "models/players/football-player-detection-1.0.0.toml"
field = "models/field/pitch-keypoints-yolo11n-pose-0.1.0.toml"

[frames.coarse]
strategy = "uniform"
fps = 5

[frames.dense]
strategy = "uniform"
fps = 15

[frames.window]
strategy = "around"
anchor   = "shot"
before_s = 1.5
after_s  = 0.5
fps      = "native"

[modules.players]
impl   = "edge.modules.stubs:StubPlayers"
frames   = "dense"

[modules.ball]
impl   = "edge.modules.stubs:StubBall"
frames = "dense"

[modules.field]
impl   = "edge.modules.stubs:StubField"
frames   = "dense"

[modules.shot]
impl   = "edge.modules.shot:BallBreakShot"
frames = "dense"

[modules.tracking]
impl   = "edge.modules.stubs:StubTracking"
frames   = "dense"

[modules.pose]
impl   = "edge.modules.stubs:StubPose"
frames   = "dense"

[modules.identity]
impl   = "edge.modules.stubs:StubIdentity"
frames   = "dense"

[features.body_part]
impl = "edge.features.body_part:BodyPart"

[features.type_of_play]
impl = "edge.features.type_of_play:TypeOfPlay"
